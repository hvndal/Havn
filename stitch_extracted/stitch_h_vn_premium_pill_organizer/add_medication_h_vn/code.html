<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Transactional intent - simplified nav) -->
<header class="flex justify-between items-center w-full px-margin-edge py-stack-sm bg-background">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full active:scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="chevron_left" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
</button>
<h1 class="font-title-md text-title-md text-on-background text-center flex-1">Add Medication</h1>
<button aria-label="Confirm" class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 -mr-2 rounded-full active:scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="check" style="font-variation-settings: 'FILL' 0;">check</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-edge pb-stack-lg max-w-lg mx-auto w-full mt-stack-md">
<!-- Illustration / Icon Area -->
<div class="flex flex-col items-center justify-center mb-stack-lg">
<div class="w-32 h-32 rounded-3xl bg-surface-container-low shadow-[inset_0_2px_4px_rgba(255,255,255,0.5),0_8px_16px_rgba(81,99,81,0.05)] flex items-center justify-center mb-4 border border-surface-variant relative overflow-hidden">

</div>
<p class="font-label-sm text-label-sm text-outline tracking-widest uppercase">Tap to change</p>
</div>
<!-- Form Fields -->
<div class="bg-surface-container-lowest rounded-DEFAULT border border-surface-variant shadow-[0_4px_24px_rgba(0,0,0,0.02)] mb-stack-lg">
<label class="form-row flex items-center justify-between px-gutter py-4 cursor-pointer hover:bg-surface-container-low/50 transition-colors rounded-t-DEFAULT">
<span class="font-body-md text-body-md text-on-surface">Name</span>
<div class="flex items-center gap-2">
<input class="text-right bg-transparent border-none p-0 font-body-md text-body-md text-outline focus:ring-0 w-32" placeholder="Medication name" type="text" value="Vitamin D3"/>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
</div>
</label>
<label class="form-row flex items-center justify-between px-gutter py-4 cursor-pointer hover:bg-surface-container-low/50 transition-colors">
<span class="font-body-md text-body-md text-on-surface">Dosage</span>
<div class="flex items-center gap-2">
<input class="text-right bg-transparent border-none p-0 font-body-md text-body-md text-outline focus:ring-0 w-24" placeholder="e.g. 10mg" type="text" value="1000 IU"/>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
</div>
</label>
<label class="form-row flex items-center justify-between px-gutter py-4 cursor-pointer hover:bg-surface-container-low/50 transition-colors">
<span class="font-body-md text-body-md text-on-surface">Time</span>
<div class="flex items-center gap-2">
<input class="text-right bg-transparent border-none p-0 font-body-md text-body-md text-outline focus:ring-0 appearance-none [&amp;::-webkit-calendar-picker-indicator]:hidden" type="time" value="07:30"/>
<span class="font-body-md text-body-md text-outline ml-1">AM</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
</div>
</label>
<label class="form-row flex items-center justify-between px-gutter py-4 cursor-pointer hover:bg-surface-container-low/50 transition-colors rounded-b-DEFAULT">

<div class="flex items-center gap-2">
<select class="text-right bg-transparent border-none p-0 font-body-md text-body-md text-outline focus:ring-0 appearance-none pr-6 w-24 relative z-10" dir="rtl">
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="as_needed">As needed</option>
</select>
<!-- Chevron handled by select appearance usually, but adding for strict design matching if needed -->
<span class="material-symbols-outlined text-outline-variant absolute right-gutter pointer-events-none" data-icon="chevron_right" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
</div>
</label>
