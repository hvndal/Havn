<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting - Soft and warm
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(5, 10, 5);
scene.add(directionalLight);

// The Pill Box - A minimalist, rounded box
const boxGroup = new THREE.Group();

// Main Body
const bodyGeometry = new THREE.BoxGeometry(3, 0.6, 1.2, 1, 1, 1);
// Custom rounding approach using a simple box with rounded material effect
const bodyMaterial = new THREE.MeshPhongMaterial({ 
    color: 0xf5f3ef, // Warm white/matte
    shininess: 10
});
const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
boxGroup.add(body);

// Lid (slightly smaller/offset)
const lidGeometry = new THREE.BoxGeometry(3, 0.1, 1.2);
const lid = new THREE.Mesh(lidGeometry, bodyMaterial);
lid.position.y = 0.35;
boxGroup.add(lid);

// Slots/Compartments (visual markers)
for(let i = -3; i <= 3; i++) {
    const slotGeo = new THREE.BoxGeometry(0.35, 0.05, 0.8);
    const slotMat = new THREE.MeshBasicMaterial({ color: 0xdbdad6 });
    const slot = new THREE.Mesh(slotGeo, slotMat);
    slot.position.set(i * 0.42, 0.41, 0);
    boxGroup.add(slot);
}

scene.add(boxGroup);

// Slow ambient rotation
function animate() {
    requestAnimationFrame(animate);
    boxGroup.rotation.y += 0.002;
    boxGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.05;
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
