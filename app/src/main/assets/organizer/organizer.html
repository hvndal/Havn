<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Hävn 3D Pill Organizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #FAF8F4;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #bg-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.65;
    pointer-events: none;
  }
  #c {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: grab;
    display: block;
  }
  #c:active { cursor: grabbing; }
  #hud {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 3;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #1B1C1A;
    background: rgba(255, 255, 255, 0.85);
    padding: 6px 14px;
    border-radius: 9999px;
    border: 1px solid #E4E2DE;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(81, 99, 81, 0.08);
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="c"></canvas>
<div id="hud">
  <span>Interact</span>
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#516351" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 14a4 4 0 1 1 4-4 4 4 4 0 0 1-4 4z"/></svg>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 1. W E B G L   A M B I E N T   S H A D E R  (from stitch ANIMATION_4)
// ─────────────────────────────────────────────────────────────────────────────
(function initShader() {
  const bgCanvas = document.getElementById('bg-canvas');
  const gl = bgCanvas.getContext('webgl') || bgCanvas.getContext('experimental-webgl');
  if (!gl) return;

  function syncShaderSize() {
    const w = bgCanvas.clientWidth || window.innerWidth;
    const h = bgCanvas.clientHeight || window.innerHeight;
    if (bgCanvas.width !== w || bgCanvas.height !== h) {
      bgCanvas.width = w;
      bgCanvas.height = h;
    }
  }
  syncShaderSize();
  window.addEventListener('resize', syncShaderSize);

  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;

  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    vec3 ivory = vec3(0.98, 0.97, 0.96); // #FAF8F4
    vec3 sand = vec3(0.95, 0.93, 0.90);  // Warm Sand
    vec3 sage = vec3(0.55, 0.63, 0.55);  // #8DA08C (Muted Sage)
    
    float wave1 = sin(uv.x * 2.0 + u_time * 0.1) * 0.5 + 0.5;
    float wave2 = cos(uv.y * 3.0 - u_time * 0.15) * 0.5 + 0.5;
    float noise = wave1 * wave2;
    
    vec3 color = mix(ivory, sand, noise * 0.35);
    float vignette = length(uv - 0.5);
    color *= 1.0 - vignette * 0.12;
    
    gl_FragColor = vec4(color, 1.0);
}`;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');

  function renderShader(t) {
    syncShaderSize();
    gl.viewport(0, 0, bgCanvas.width, bgCanvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, bgCanvas.width, bgCanvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(renderShader);
  }
  requestAnimationFrame(renderShader);
})();

// ─────────────────────────────────────────────────────────────────────────────
// 2. 3 D   V I R T U A L   P I L L   O R G A N I Z E R  (from Three.js + Canvas)
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
let H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);

const DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
const SLOTS = 7;

// Color Palette (from Warm Minimalism DESIGN.md & code.html)
const PALETTE = {
  bg: 'transparent',
  caseBody: '#F5F3EF',     // bodyMaterial color 0xf5f3ef
  caseShadow: '#E4E2DE',   // surface-container-highest
  slotMarker: '#DBDAD6',   // slot color 0xdbdad6
  lidClosed: '#FAF8F4',    // surface-bright
  lidOpen: '#D4E8D2',      // primary-fixed
  lidEdge: '#C3C8C0',      // outline-variant
  text: '#747872',         // outline
  textActive: '#516351',   // primary
  pillSage: '#8DA08C',     // primary-container
  pillAmber: '#E2C381',    // tertiary-fixed-dim
  pillTerracotta: '#FEB28F',// secondary-container
  pillSlate: '#9BAEB5',
};

const PILL_COLORS = [PALETTE.pillSage, PALETTE.pillAmber, PALETTE.pillTerracotta, PALETTE.pillSlate];

let rotX = 0.40;
let rotY = 0.0;
let targetRotY = 0.0;
let targetRotX = 0.40;
let idleTime = 0;

let weekData = Array(SLOTS).fill(null).map(() => ({ count: 0, colors: [], isToday: false }));
let selectedDay = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;

const openAngle = Array(SLOTS).fill(0);
const anglePos   = Array(SLOTS).fill(0);
const angleVel   = Array(SLOTS).fill(0);

function slotHasPills(i) {
  return weekData[i] && weekData[i].count > 0;
}

function slotColors(i) {
  if (!weekData[i] || !weekData[i].colors || weekData[i].colors.length === 0) {
    return [PILL_COLORS[i % PILL_COLORS.length]];
  }
  return weekData[i].colors;
}

const K = 170.0;
const DAMP = 15.0;

let isDragging = false;
let startX = 0, startY = 0;

function resize() {
  W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
  H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
}
window.addEventListener('resize', resize);

const fov = 650;

function project(x, y, z) {
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;

  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  let y2 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;

  const dist = fov / (fov + z2 + 400);
  return {
    px: W / 2 + x1 * dist,
    py: H / 2 + y2 * dist,
    scale: dist,
    z: z2,
  };
}

function render(timestamp) {
  ctx.clearRect(0, 0, W, H);

  // Slow ambient rotation matching Three.js scene
  idleTime += 0.005;
  if (!isDragging) {
    targetRotY += 0.0015;
    targetRotX = 0.40 + Math.sin(idleTime) * 0.03;
  }

  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;

  const slotW = 52;
  const slotH = 135;
  const slotDepth = 36;
  const gap = 12;
  const totalW = SLOTS * slotW + (SLOTS - 1) * gap;
  const casePaddingX = 22;
  const casePaddingY = 18;

  const caseW = totalW + casePaddingX * 2;
  const caseH = slotH + casePaddingY * 2;

  // Soft Ambient Shadow
  const shadowCenter = project(0, caseH / 2 + 12, 0);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(shadowCenter.px, shadowCenter.py + 25, (caseW / 2 + 25) * shadowCenter.scale, 40 * shadowCenter.scale, 0, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(shadowCenter.px, shadowCenter.py + 25, 5, shadowCenter.px, shadowCenter.py + 25, (caseW / 2 + 25) * shadowCenter.scale);
  grad.addColorStop(0, 'rgba(81, 99, 81, 0.12)');
  grad.addColorStop(1, 'rgba(251, 249, 245, 0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Case Base Body
  const c0 = project(-caseW / 2, -caseH / 2, 0);
  const c1 = project(caseW / 2, -caseH / 2, 0);
  const c2 = project(caseW / 2, caseH / 2, 0);
  const c3 = project(-caseW / 2, caseH / 2, 0);

  const cb2 = project(caseW / 2, caseH / 2, slotDepth);
  const cb3 = project(-caseW / 2, caseH / 2, slotDepth);

  ctx.fillStyle = PALETTE.caseShadow;
  ctx.beginPath();
  ctx.moveTo(c3.px, c3.py);
  ctx.lineTo(c2.px, c2.py);
  ctx.lineTo(cb2.px, cb2.py);
  ctx.lineTo(cb3.px, cb3.py);
  ctx.fill();

  ctx.fillStyle = PALETTE.caseBody;
  ctx.beginPath();
  ctx.moveTo(c0.px, c0.py);
  ctx.lineTo(c1.px, c1.py);
  ctx.lineTo(c2.px, c2.py);
  ctx.lineTo(c3.px, c3.py);
  ctx.fill();
  ctx.strokeStyle = PALETTE.lidEdge;
  ctx.lineWidth = 1.5 * c0.scale;
  ctx.stroke();

  // Slots & Lids
  const startXPos = -totalW / 2 + slotW / 2;

  for (let i = 0; i < SLOTS; i++) {
    const sx = startXPos + i * (slotW + gap);
    const sy = 0;

    const w0 = project(sx - slotW/2, sy - slotH/2, 4);
    const w1 = project(sx + slotW/2, sy - slotH/2, 4);
    const w2 = project(sx + slotW/2, sy + slotH/2, 4);
    const w3 = project(sx - slotW/2, sy + slotH/2, 4);

    ctx.fillStyle = PALETTE.slotMarker;
    ctx.beginPath();
    ctx.moveTo(w0.px, w0.py);
    ctx.lineTo(w1.px, w1.py);
    ctx.lineTo(w2.px, w2.py);
    ctx.lineTo(w3.px, w3.py);
    ctx.fill();

    if (slotHasPills(i)) {
      const colors = slotColors(i);
      const pillCount = Math.min(colors.length, 3);
      for (let p = 0; p < pillCount; p++) {
        const offsetX = (p - (pillCount - 1) / 2) * 10;
        const pCenter = project(sx + offsetX, sy + (p * 3), 14 + p * 2);
        const pillColor = colors[p] || PILL_COLORS[i % PILL_COLORS.length];

        ctx.save();
        ctx.translate(pCenter.px, pCenter.py);
        ctx.rotate(-Math.PI / 6);

        ctx.fillStyle = pillColor;
        ctx.beginPath();
        ctx.arc(0, -8 * pCenter.scale, 9 * pCenter.scale, Math.PI, 0);
        ctx.rect(-9 * pCenter.scale, -8 * pCenter.scale, 18 * pCenter.scale, 8 * pCenter.scale);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(0, 8 * pCenter.scale, 9 * pCenter.scale, 0, Math.PI);
        ctx.rect(-9 * pCenter.scale, 0, 18 * pCenter.scale, 8 * pCenter.scale);
        ctx.fill();

        ctx.restore();
      }
      if (weekData[i].count > 3) {
        const badge = project(sx + slotW/2 - 8, sy - slotH/2 + 8, 20);
        ctx.fillStyle = PALETTE.textActive;
        ctx.beginPath();
        ctx.arc(badge.px, badge.py, 8 * badge.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `bold ${Math.max(8, Math.round(9 * badge.scale))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('+' + (weekData[i].count - 2), badge.px, badge.py + 3 * badge.scale);
      }
    } else {
      const emptyPos = project(sx, sy, 10);
      ctx.strokeStyle = PALETTE.lidEdge;
      ctx.lineWidth = 1 * emptyPos.scale;
      ctx.setLineDash([3 * emptyPos.scale, 3 * emptyPos.scale]);
      ctx.beginPath();
      ctx.ellipse(emptyPos.px, emptyPos.py, 14 * emptyPos.scale, 6 * emptyPos.scale, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    const lblPos = project(sx, sy + slotH/2 + 8, 0);
    ctx.fillStyle = PALETTE.text;
    ctx.font = `600 ${Math.max(9, Math.round(11 * lblPos.scale))}px "Hanken Grotesk", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(DAYS[i], lblPos.px, lblPos.py);

    const dt = 0.016;
    const target = openAngle[i] * 1.8;
    const force = K * (target - anglePos[i]) - DAMP * angleVel[i];
    angleVel[i] += force * dt;
    anglePos[i] += angleVel[i] * dt;

    const topY = sy - slotH / 2;
    const lidHeight = slotH;

    const angle = anglePos[i];
    const lidZ = Math.sin(angle) * lidHeight;
    const lidYOffset = Math.cos(angle) * lidHeight;

    const l0 = project(sx - slotW/2, topY, 0);
    const l1 = project(sx + slotW/2, topY, 0);
    const l2 = project(sx + slotW/2, topY + lidYOffset, -lidZ);
    const l3 = project(sx - slotW/2, topY + lidYOffset, -lidZ);

    const isLidOpen = angle > 0.2;
    const isSelected = i === selectedDay;
    const isToday = weekData[i] && weekData[i].isToday;

    if (isSelected) ctx.fillStyle = PALETTE.lidOpen;
    else if (isToday) ctx.fillStyle = '#E9F0E8';
    else ctx.fillStyle = isLidOpen ? PALETTE.lidOpen : PALETTE.lidClosed;

    ctx.beginPath();
    ctx.moveTo(l0.px, l0.py);
    ctx.lineTo(l1.px, l1.py);
    ctx.lineTo(l2.px, l2.py);
    ctx.lineTo(l3.px, l3.py);
    ctx.fill();

    ctx.strokeStyle = isSelected ? PALETTE.textActive : (isToday ? PALETTE.textActive : (isLidOpen ? PALETTE.textActive : PALETTE.lidEdge));
    ctx.lineWidth = 1.5 * l0.scale;
    ctx.stroke();

    const lidCenter = project(sx, topY + lidYOffset / 2, -lidZ / 2);
    ctx.fillStyle = isLidOpen ? PALETTE.textActive : PALETTE.text;
    ctx.font = `bold ${Math.max(10, Math.round(13 * lidCenter.scale))}px "Hanken Grotesk", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(DAYS[i][0], lidCenter.px, lidCenter.py);
  }

  requestAnimationFrame(render);
}

canvas.addEventListener('pointerdown', (e) => {
  isDragging = false;
  startX = e.clientX;
  startY = e.clientY;
});

canvas.addEventListener('pointermove', (e) => {
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
    isDragging = true;
    targetRotY += dx * 0.005;
    targetRotX = Math.max(0.1, Math.min(0.8, targetRotX + dy * 0.003));
    startX = e.clientX;
    startY = e.clientY;
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!isDragging) {
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (window.devicePixelRatio || 1);

    const slotW = 52 + 12;
    const totalW = SLOTS * slotW;
    const startXPos = W / 2 - totalW / 2;
    const clickedSlot = Math.floor((clickX - startXPos) / slotW);

    if (clickedSlot >= 0 && clickedSlot < SLOTS) {
      HavnOrganizer.toggleSlot(clickedSlot);
      if (window.AndroidOrganizer) {
        window.AndroidOrganizer.onSlotTapped(clickedSlot, openAngle[clickedSlot] === 1);
      }
      const hud = document.getElementById('hud');
      if (hud) hud.style.opacity = '0';
    }
  }
});

window.HavnOrganizer = {
  setWeekData: (data) => {
    if (Array.isArray(data) && data.length === SLOTS) weekData = data;
  },
  selectDay: (i) => {
    if (i < 0 || i >= SLOTS) return;
    selectedDay = i;
    for (let j = 0; j < SLOTS; j++) openAngle[j] = j === i ? 1 : 0;
  },
  openSlot: (i) => { if (i >= 0 && i < SLOTS) { selectedDay = i; openAngle[i] = 1; } },
  closeSlot: (i) => { if (i >= 0 && i < SLOTS) openAngle[i] = 0; },
  toggleSlot: (i) => {
    if (i < 0 || i >= SLOTS) return;
    selectedDay = i;
    openAngle[i] = openAngle[i] === 0 ? 1 : 0;
    for (let j = 0; j < SLOTS; j++) if (j !== i) openAngle[j] = 0;
  },
};

render(0);
</script>
</body>
</html>
