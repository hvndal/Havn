<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Hävn 3D Pill Organizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #FAF8F4;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: rgba(81,99,81,0.65);
    text-transform: uppercase;
    pointer-events: none;
    background: rgba(255,255,255,0.7);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(228,226,222,0.8);
    backdrop-filter: blur(8px);
    transition: opacity 1.5s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Tap lid to open · Swipe to rotate</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  H Ä V N  —  3D  P I L L  O R G A N I Z E R  (Standalone WebGL Engine)
//  High-precision 3D ceramic pill case with spring physics & soft shadows
// ─────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = canvas.width = window.innerWidth * window.devicePixelRatio;
let H = canvas.height = window.innerHeight * window.devicePixelRatio;

const DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
const SLOTS = 7;

// Color Palette (Warm Minimalism)
const PALETTE = {
  bg: '#FAF8F4',
  caseBody: '#EDEBE6',
  caseShadow: '#DEDCD6',
  lidClosed: '#F5F3EF',
  lidOpen: '#E2EAE2',
  lidEdge: '#D8D6D0',
  text: '#747872',
  textActive: '#516351',
  pillSage: '#8DA08C',
  pillAmber: '#DAA560',
  pillTerracotta: '#C07050',
  pillSlate: '#9BAEB5',
  pillSand: '#BEB09A',
};

const PILL_COLORS = [PALETTE.pillSage, PALETTE.pillAmber, PALETTE.pillTerracotta, PALETTE.pillSlate];

// 3D State & Camera Controls
let rotX = 0.45;  // pitch angle
let rotY = 0.0;   // yaw angle
let targetRotY = 0.0;
let targetRotX = 0.45;

const openAngle = Array(SLOTS).fill(0); // 0 = closed, 1 = open (spring target)
const anglePos   = Array(SLOTS).fill(0); // current angle pos
const angleVel   = Array(SLOTS).fill(0); // spring velocity
const pills      = Array(SLOTS).fill(true); // pills inside

// Spring constants
const K = 160.0;
const DAMP = 14.0;

// Input handling
let isDragging = false;
let startX = 0, startY = 0;
let lastTapTime = 0;

function resize() {
  W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
  H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
}
window.addEventListener('resize', resize);

// ─── 3D Projection Helpers ───────────────────────────────────────────────────
const fov = 600;

function project(x, y, z) {
  // Rotate Y
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;

  // Rotate X
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  let y2 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;

  const dist = fov / (fov + z2 + 400);
  return {
    px: W / 2 + x1 * dist,
    py: H / 2 + y2 * dist,
    scale: dist,
    z: z2,
  };
}

// ─── Render Engine ───────────────────────────────────────────────────────────
function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function render() {
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, W, H);

  // Smooth camera easing
  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;

  // Case dimensions in 3D space
  const slotW = 54;
  const slotH = 140;
  const slotDepth = 40;
  const gap = 12;
  const totalW = SLOTS * slotW + (SLOTS - 1) * gap;
  const casePaddingX = 24;
  const casePaddingY = 20;

  const caseW = totalW + casePaddingX * 2;
  const caseH = slotH + casePaddingY * 2;

  // 1. Draw Drop Shadow (Soft ambient occlusion below case)
  const shadowCenter = project(0, caseH / 2 + 15, 0);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(shadowCenter.px, shadowCenter.py + 30, (caseW / 2 + 30) * shadowCenter.scale, 45 * shadowCenter.scale, 0, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(shadowCenter.px, shadowCenter.py + 30, 10, shadowCenter.px, shadowCenter.py + 30, (caseW / 2 + 30) * shadowCenter.scale);
  grad.addColorStop(0, 'rgba(81, 99, 81, 0.14)');
  grad.addColorStop(1, 'rgba(250, 248, 244, 0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // 2. Draw Ceramic Case Base (Back/Bottom Extrusion)
  const c0 = project(-caseW / 2, -caseH / 2, 0);
  const c1 = project(caseW / 2, -caseH / 2, 0);
  const c2 = project(caseW / 2, caseH / 2, 0);
  const c3 = project(-caseW / 2, caseH / 2, 0);

  const cb0 = project(-caseW / 2, -caseH / 2, slotDepth);
  const cb1 = project(caseW / 2, -caseH / 2, slotDepth);
  const cb2 = project(caseW / 2, caseH / 2, slotDepth);
  const cb3 = project(-caseW / 2, caseH / 2, slotDepth);

  // Side rim shading
  ctx.fillStyle = PALETTE.caseShadow;
  ctx.beginPath();
  ctx.moveTo(c3.px, c3.py);
  ctx.lineTo(c2.px, c2.py);
  ctx.lineTo(cb2.px, cb2.py);
  ctx.lineTo(cb3.px, cb3.py);
  ctx.fill();

  // Main Case Face
  ctx.fillStyle = PALETTE.caseBody;
  ctx.beginPath();
  ctx.moveTo(c0.px, c0.py);
  ctx.lineTo(c1.px, c1.py);
  ctx.lineTo(c2.px, c2.py);
  ctx.lineTo(c3.px, c3.py);
  ctx.fill();
  ctx.strokeStyle = PALETTE.lidEdge;
  ctx.lineWidth = 2 * c0.scale;
  ctx.stroke();

  // 3. Draw Slots, Pills, and Lids
  const startXPos = -totalW / 2 + slotW / 2;

  for (let i = 0; i < SLOTS; i++) {
    const sx = startXPos + i * (slotW + gap);
    const sy = 0;

    // Well background (recessed interior shadow)
    const w0 = project(sx - slotW/2, sy - slotH/2, 5);
    const w1 = project(sx + slotW/2, sy - slotH/2, 5);
    const w2 = project(sx + slotW/2, sy + slotH/2, 5);
    const w3 = project(sx - slotW/2, sy + slotH/2, 5);

    ctx.fillStyle = PALETTE.caseShadow;
    ctx.beginPath();
    ctx.moveTo(w0.px, w0.py);
    ctx.lineTo(w1.px, w1.py);
    ctx.lineTo(w2.px, w2.py);
    ctx.lineTo(w3.px, w3.py);
    ctx.fill();

    // Draw Pill inside well
    if (pills[i]) {
      const pCenter = project(sx, sy, 15);
      const pillColor = PILL_COLORS[i % PILL_COLORS.length];

      ctx.save();
      ctx.translate(pCenter.px, pCenter.py);
      ctx.rotate(-Math.PI / 6);

      // Pill capsule half 1
      ctx.fillStyle = pillColor;
      ctx.beginPath();
      ctx.arc(0, -10 * pCenter.scale, 12 * pCenter.scale, Math.PI, 0);
      ctx.rect(-12 * pCenter.scale, -10 * pCenter.scale, 24 * pCenter.scale, 10 * pCenter.scale);
      ctx.fill();

      // Pill capsule half 2 (ivory contrast half)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, 10 * pCenter.scale, 12 * pCenter.scale, 0, Math.PI);
      ctx.rect(-12 * pCenter.scale, 0, 24 * pCenter.scale, 10 * pCenter.scale);
      ctx.fill();

      // Pill shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(-8 * pCenter.scale, -12 * pCenter.scale, 4 * pCenter.scale, 20 * pCenter.scale);

      ctx.restore();
    }

    // Day Label (Printed on Case Top Rim)
    const lblPos = project(sx, sy + slotH/2 + 10, 0);
    ctx.fillStyle = PALETTE.text;
    ctx.font = `600 ${Math.max(9, Math.round(11 * lblPos.scale))}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(DAYS[i], lblPos.px, lblPos.py);

    // Spring Physics for Lid Angle
    const dt = 0.016;
    const target = openAngle[i] * 1.8; // max open angle ~100 deg
    const force = K * (target - anglePos[i]) - DAMP * angleVel[i];
    angleVel[i] += force * dt;
    anglePos[i] += angleVel[i] * dt;

    // Draw Lid (Pivoting from top edge)
    const topY = sy - slotH / 2;
    const lidHeight = slotH;

    // Compute rotated 3D coordinates for lid top & bottom
    const angle = anglePos[i];
    const lidZ = Math.sin(angle) * lidHeight;
    const lidYOffset = Math.cos(angle) * lidHeight;

    const l0 = project(sx - slotW/2, topY, 0);
    const l1 = project(sx + slotW/2, topY, 0);
    const l2 = project(sx + slotW/2, topY + lidYOffset, -lidZ);
    const l3 = project(sx - slotW/2, topY + lidYOffset, -lidZ);

    const isLidOpen = angle > 0.2;
    ctx.fillStyle = isLidOpen ? PALETTE.lidOpen : PALETTE.lidClosed;

    ctx.beginPath();
    ctx.moveTo(l0.px, l0.py);
    ctx.lineTo(l1.px, l1.py);
    ctx.lineTo(l2.px, l2.py);
    ctx.lineTo(l3.px, l3.py);
    ctx.fill();

    ctx.strokeStyle = isLidOpen ? 'rgba(81,99,81,0.4)' : PALETTE.lidEdge;
    ctx.lineWidth = 1.5 * l0.scale;
    ctx.stroke();

    // Lid Label
    const lidCenter = project(sx, topY + lidYOffset / 2, -lidZ / 2);
    ctx.fillStyle = isLidOpen ? PALETTE.textActive : PALETTE.text;
    ctx.font = `bold ${Math.max(10, Math.round(13 * lidCenter.scale))}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(DAYS[i][0], lidCenter.px, lidCenter.py);
  }

  requestAnimationFrame(render);
}

// ─── Interaction & Raycasting ────────────────────────────────────────────────
canvas.addEventListener('pointerdown', (e) => {
  isDragging = false;
  startX = e.clientX;
  startY = e.clientY;
  lastTapTime = Date.now();
});

canvas.addEventListener('pointermove', (e) => {
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
    isDragging = true;
    targetRotY += dx * 0.005;
    targetRotX = Math.max(0.1, Math.min(0.8, targetRotX + dy * 0.003));
    startX = e.clientX;
    startY = e.clientY;
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (!isDragging) {
    // Check tap on slot
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (window.devicePixelRatio || 1);

    const slotW = 54 + 12;
    const totalW = SLOTS * slotW;
    const startXPos = W / 2 - totalW / 2;
    const clickedSlot = Math.floor((clickX - startXPos) / slotW);

    if (clickedSlot >= 0 && clickedSlot < SLOTS) {
      openAngle[clickedSlot] = openAngle[clickedSlot] === 0 ? 1 : 0;
      if (window.AndroidOrganizer) {
        window.AndroidOrganizer.onSlotTapped(clickedSlot, openAngle[clickedSlot] === 1);
      }
      const hud = document.getElementById('hud');
      if (hud) hud.style.opacity = '0';
    }
  }
});

// External Android Bridge API
window.HavnOrganizer = {
  openSlot: (i) => { if (i >= 0 && i < SLOTS) openAngle[i] = 1; },
  closeSlot: (i) => { if (i >= 0 && i < SLOTS) openAngle[i] = 0; },
  toggleSlot: (i) => { if (i >= 0 && i < SLOTS) openAngle[i] = openAngle[i] === 0 ? 1 : 0; },
};

// Start 3D Engine
render();
</script>
</body>
</html>
