name: Release build (Play Store)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.HAVN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the HAVN_KEYSTORE_BASE64 secret first (see PUBLISHING.md)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/havn-upload.jks"
          echo "HAVN_KEYSTORE=$RUNNER_TEMP/havn-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB + APK
        env:
          HAVN_KEYSTORE_PASSWORD: ${{ secrets.HAVN_KEYSTORE_PASSWORD }}
          HAVN_KEY_ALIAS: ${{ secrets.HAVN_KEY_ALIAS }}
          HAVN_KEY_PASSWORD: ${{ secrets.HAVN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: havn-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
